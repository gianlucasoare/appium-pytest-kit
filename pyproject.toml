[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilkit"
version = "0.1.0"
description = "Reusable Appium 2.x + pytest mobile test framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mobilkit contributors" }]
keywords = ["appium", "pytest", "mobile", "automation", "framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: Pytest",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "Appium-Python-Client>=4.0.0",
  "pydantic-settings>=2.3.0",
  "pytest>=8.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
mobilkit-init = "mobilkit.cli:main"

[project.entry-points.pytest11]
mobilkit = "mobilkit.pytest_plugin"

[project.urls]
Homepage = "https://example.com/mobilkit"
Documentation = "https://example.com/mobilkit/docs"
Repository = "https://example.com/mobilkit/repo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobilkit = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit"]
markers = [
  "integration: requires running Appium server and a device/emulator",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
